<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=pe_mp_workbench.html">
  <title>PE_MP Design Workbench</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: #111827;
      background: #f3f4f6;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    main {
      width: min(560px, calc(100vw - 32px));
      padding: 28px;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0 0 18px;
      color: #4b5563;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("pe_mp_workbench.html");
  </script>
</head>
<body>
  <main>
    <h1>PE_MP Design Workbench</h1>
    <p>正在打开 PE_MP 设计工作台。如果页面没有自动跳转，请点击下面的按钮。</p>
    <a href="pe_mp_workbench.html">打开工作台</a>
  </main>
</body>
</html>
